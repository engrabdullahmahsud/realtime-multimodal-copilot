# pnpm workspace configuration
# This file defines the monorepo structure and package resolution

packages:
  # Applications
  - 'apps/*'

  # Shared packages
  - 'packages/*'
  # Services (future)
  # - 'services/*'

  # Workspace settings
allowBuilds:
  es5-ext: set this to true or false
  esbuild: set this to true or false
catalog:
  # Shared dependency versions for consistency across packages
  typescript: ^5.3.0
  eslint: ^8.56.0
  prettier: ^3.2.0
  vitest: ^1.2.0
  zod: ^3.22.0
  date-fns: ^3.2.0
  clsx: ^2.1.0
  tailwind-merge: ^2.2.0
  lucide-react: ^0.312.0
  '@radix-ui/react-slot': ^1.0.2
  '@radix-ui/react-icons': ^1.3.0
  class-variance-authority: ^0.7.0
  tailwindcss: ^3.4.0
  postcss: ^8.4.0
  autoprefixer: ^10.4.0
  hono: ^4.0.0
  '@hono/zod-validator': ^0.2.0
  '@tanstack/react-query': ^5.17.0
  '@tanstack/react-table': ^8.11.0
  react: ^18.2.0
  react-dom: ^18.2.0
  next: ^14.1.0
  '@next/bundle-analyzer': ^14.1.0
  drizzle-orm: ^0.29.0
  drizzle-kit: ^0.20.0
  postgres: ^3.4.0
  '@neondatabase/serverless': ^0.9.0
  ioredis: ^5.3.0
  bullmq: ^5.0.0
  '@aws-sdk/client-s3': ^3.490.0
  '@aws-sdk/s3-request-presigner': ^3.490.0
  openai: ^4.26.0
  '@anthropic-ai/sdk': ^0.18.0
  zod-to-json-schema: ^3.22.0
  '@mswjs/data': ^0.14.0
  msw: ^2.1.0
  '@testing-library/react': ^14.1.0
  '@testing-library/jest-dom': ^6.2.0
  '@testing-library/user-event': ^14.5.0
  jsdom: ^24.0.0
  tsup: ^8.0.0
  dotenv: ^16.4.0
  '@types/react': ^18.2.0
  '@types/react-dom': ^18.2.0
